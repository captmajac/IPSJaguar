<style>
    /* design colors of the tile visualization passed by the HTML-SDK: --content-color (text), --accent-color and
       --on-accent-color (controls); fallbacks are the Symcon defaults */
    html, body { height: 100%; margin: 0; }
    #jt {
        --jt-text: var(--content-color, inherit);
        --jt-line: rgba(127, 127, 127, 0.25);
        --jt-line: color-mix(in srgb, var(--content-color, #7F7F7F) 18%, transparent);
        --jt-card: rgba(127, 127, 127, 0.1);
        --jt-card: color-mix(in srgb, var(--content-color, #7F7F7F) 7%, transparent);
        --jt-accent: var(--accent-color, #00CDAB);
        --jt-green: #43A047; --jt-orange: #FB8C00; --jt-red: #E53935;
        font-family: inherit; color: var(--jt-text); height: 100%; box-sizing: border-box; padding: 60px 20px 12px;
        display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    }
    #jt *, #jt *::before { box-sizing: border-box; }
    #jt button { font: inherit; color: inherit; cursor: pointer; }
    /* the top padding of #jt stays free: Symcon shows the instance name and its enlarge button there */
    #jt .head { display: flex; align-items: center; gap: 8px; flex: none; min-width: 0; }
    #jt .title { flex: 1; min-width: 0; }
    #jt .name { font-size: 1.25em; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #jt .stand { font-size: 0.75em; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #jt .pill { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85em; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--jt-card); }
    #jt .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--jt-red); }
    #jt .pill.on i { background: var(--jt-green); }
    #jt .refresh { flex: none; width: 36px; height: 36px; padding: 0; border: none; border-radius: 50%; background: var(--jt-card); display: grid; place-items: center; }
    #jt .refresh svg { width: 16px; height: 16px; }
    #jt .refresh.busy svg { animation: jt-spin 0.9s linear infinite; }
    @keyframes jt-spin { to { transform: rotate(360deg); } }
    #jt .tabs { display: flex; flex: none; gap: 2px; padding: 3px; border-radius: 10px; background: var(--jt-card); }
    #jt .tabs button { flex: 1; min-width: 0; background: none; border: none; border-radius: 8px; padding: 5px 4px; font-weight: 600; opacity: 0.65; }
    #jt .tabs button.active { opacity: 1; background: var(--jt-accent); color: var(--on-accent-color, #FFFFFF); }
    #jt .page { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: none; flex-direction: column; gap: 10px; scrollbar-width: thin; }
    #jt .page.active { display: flex; }
    #jt .card { background: var(--jt-card); border-radius: 12px; padding: 12px; flex: none; }
    #jt h3 { margin: 0 0 6px; font-size: 0.78em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
    #jt .hero { display: flex; align-items: center; gap: 14px; }
    #jt .ring { position: relative; flex: none; width: 120px; height: 120px; }
    #jt .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    #jt .ring circle { fill: none; stroke-width: 9; }
    #jt .ring .track { stroke: var(--jt-line); }
    #jt .ring .bar { stroke: var(--jt-accent); stroke-linecap: round; transition: stroke-dasharray 0.4s; }
    #jt .ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #jt .ring b { font-size: 1.6em; line-height: 1.15; }
    #jt .ring span { font-size: 0.85em; font-weight: 600; opacity: 0.7; white-space: nowrap; }
    #jt .facts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    #jt .fact { display: flex; align-items: center; gap: 9px; min-width: 0; }
    #jt .fact svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #jt .fact b { font-weight: 600; min-width: 0; white-space: nowrap; }
    #jt .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
    #jt .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82em; padding: 6px 11px; border-radius: 999px; background: var(--jt-card); }
    #jt .chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    #jt .good { color: var(--jt-green); }
    #jt .warn { color: var(--jt-orange); }
    #jt .chip.neutral i { opacity: 0.45; }
    #jt .chip span { color: var(--jt-text); }
    #jt .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--jt-line); font-size: 0.9em; }
    #jt .row:first-of-type { border-top: none; }
    #jt .row > span:first-child { opacity: 0.75; flex: none; display: inline-flex; align-items: center; gap: 9px; }
    #jt .row svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #jt .row .good { color: inherit; }
    #jt .row > span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    #jt .tyres { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    #jt .tyre { border: 1px solid var(--jt-line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
    #jt .tyre small { display: block; font-size: 0.72em; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #jt .tyre.low { border-color: var(--jt-orange); color: var(--jt-orange); }
    #jt .map { display: block; position: relative; overflow: hidden; width: 100%; height: 170px; border: 0; border-radius: 8px; background: var(--jt-line); }
    #jt .map[hidden] { display: none; }
    #jt #tiles img { position: absolute; width: 256px; height: 256px; max-width: none; }
    #jt .pin { position: absolute; left: 50%; top: 50%; width: 24px; height: 32px; transform: translate(-50%, -100%); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); }
    #jt .pin path { fill: var(--jt-accent); stroke: #FFFFFF; stroke-width: 1.5; }
    #jt .pin circle { fill: #FFFFFF; }
    #jt .map .attr { position: absolute; right: 0; bottom: 0; padding: 1px 6px; font-size: 11px; font-weight: 400; color: #333333; background: rgba(255, 255, 255, 0.8); border-top-left-radius: 4px; text-decoration: none; }
    #jt .where { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 7px; font-size: 0.78em; }
    #jt .where span { opacity: 0.7; min-width: 0; overflow-wrap: anywhere; }
    #jt .where a { flex: none; color: var(--jt-accent); text-decoration: none; font-weight: 600; }
    #jt .hint { font-size: 0.85em; opacity: 0.75; }
    #jt .big { font-size: 1.6em; font-weight: 700; }
    #jt .big small { font-size: 0.55em; font-weight: 400; opacity: 0.7; }
    #jt .bars { display: flex; align-items: flex-end; gap: 2px; height: 110px; margin-top: 8px; }
    #jt .bars button { flex: 1; min-width: 0; height: 100%; padding: 0; border: none; background: none; display: flex; align-items: flex-end; }
    #jt .bars i { display: block; width: 100%; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--jt-accent); opacity: 0.55; }
    #jt .bars .zero i { background: var(--jt-line); opacity: 1; }
    #jt .bars .selected i { opacity: 1; outline: 1px solid var(--jt-accent); }
    #jt .axis { display: flex; justify-content: space-between; font-size: 0.7em; opacity: 0.6; margin-top: 4px; }
    #jt .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: none; }
    #jt .tiles .card { padding: 9px; text-align: center; }
    #jt .tiles b { display: block; font-size: 1.15em; }
    #jt .tiles small { font-size: 0.68em; opacity: 0.7; }
    #jt .compact { display: none; flex: 1; align-items: center; gap: 12px; min-height: 0; }
    #jt .compact b { font-size: 1.6em; }
    #jt .compact div { min-width: 0; font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 340px) {
        #jt .standLabel, #jt .factLabel { display: none; }
        #jt .ring { width: 96px; height: 96px; }
        #jt .ring b { font-size: 1.3em; }
        #jt .ring span { font-size: 0.75em; }
    }
    body.small #jt { padding: 40px 20px 8px; gap: 4px; }
    body.small #jt .tabs, body.small #jt .page.active, body.small #jt .pill { display: none; }
    body.small #jt .compact { display: flex; }
</style>

<div id="jt">
    <div class="head">
        <div class="title">
            <div class="name" id="name"></div>
            <div class="stand"><span class="standLabel">Fahrzeugdaten: </span><span id="stand"></span></div>
        </div>
        <span class="pill" id="pill" title="Verbindung zum JLR Data Hub"><i></i><span id="pillText"></span></span>
        <button class="refresh" id="refresh" title="Aktualisieren" aria-label="Aktualisieren" onclick="refresh()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
    </div>
    <div class="tabs">
        <button id="tabOverview" class="active" onclick="showTab('Overview')">Übersicht</button>
        <button id="tabStats" onclick="showTab('Stats')">Statistik</button>
    </div>
    <div class="page active" id="pageOverview">
        <div class="card hero">
            <div class="ring">
                <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" id="ring" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="0 100"/></svg>
                <div class="inner"><b id="fuel"></b><span id="range"></span></div>
            </div>
            <div class="facts">
                <div class="fact" title="Kilometerstand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 13l4-5"/><circle cx="12" cy="13" r="1"/><path d="M8 17h8"/></svg><b id="odometer"></b></div>
                <div class="fact" title="12-V-Batterie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v11H3z"/><path d="M7 8V5h3v3"/><path d="M14 8V5h3v3"/><path d="M6.5 13.5h3"/><path d="M14.5 13.5h3"/><path d="M16 12v3"/></svg><b><span class="factLabel">12-V-Batterie </span><span id="voltage"></span></b></div>
            </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="card" id="vehicle"></div>
        <div class="card" id="tyreCard"></div>
        <div class="card" id="mapCard">
            <h3>Standort</h3>
            <div class="map" id="map">
                <div id="tiles"></div>
                <svg class="pin" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1C6 1 2 5.5 2 11c0 7.5 10 20 10 20s10-12.5 10-20C22 5.5 18 1 12 1z"/><circle cx="12" cy="11" r="4"/></svg>
                <a class="attr" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a>
            </div>
            <iframe class="map" id="mapFrame" title="Karte" hidden referrerpolicy="no-referrer"></iframe>
            <div class="where"><span id="where"></span><a id="mapLink" target="_blank" rel="noopener noreferrer">Karte öffnen</a></div>
        </div>
    </div>
    <div class="page" id="pageStats">
        <div class="card">
            <h3 id="dayLabel"></h3>
            <div class="big" id="dayKm"></div>
            <div class="bars" id="bars"></div>
            <div class="axis"><span id="axisFrom"></span><span>letzte 30 Tage</span><span>heute</span></div>
        </div>
        <div class="tiles">
            <div class="card"><b id="total"></b><small>km Strecke</small></div>
            <div class="card"><b id="perDay"></b><small>km je Fahrtag</small></div>
            <div class="card"><b id="drivingDays"></b><small>Fahrtage</small></div>
        </div>
        <div class="hint">Aus den Änderungen des Kilometerstands berechnet. Einzelne Fahrten stellt JLR nicht bereit.</div>
    </div>
    <div class="compact">
        <b id="smallFuel"></b>
        <div id="smallText"></div>
    </div>
</div>

<script>
    // Texts are German on purpose, like the tile of the other modules
    let state = null;
    let selected = null;
    let mapKey = '';
    let mapPos = null;
    let tilesKey = '';
    let tilesFailed = false;
    let busyTimer = 0;
    const $ = id => document.getElementById(id);
    const CAR = '<path d="M3 17v-4l3-1 3-5h6l4 5 2 1v4z"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>';
    // fixed markup, never data from the API
    const ICONS = {
        'Türen': '<path d="M5 21V10l6-7h8v18z"/><path d="M5 11h14"/><path d="M14 15h2"/>',
        'Fenster': '<path d="M4 4h16v16H4z"/><path d="M12 4v16"/><path d="M4 12h16"/>',
        'Verdeck': '<path d="M3 18h18"/><path d="M5 18c0-6 4-10 9-10h3l3 10"/>',
        'Kofferraum': CAR + '<path d="M19 12l2-4"/>',
        'Motorhaube': CAR + '<path d="M6 12L3 8"/>',
        'Service in': '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.9-.7-.7-2.9z"/>',
        'Warnungen': '<path d="M12 3L2 20h20z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
    };

    function el(tag, className, text) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    const number = (v, digits = 0) => Number(v).toLocaleString('de-DE', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const unit = (v, suffix, digits = 0) => v === null || v === undefined ? '–' : number(v, digits) + ' ' + suffix;
    const two = n => String(n).padStart(2, '0');

    function stamp(ts) {
        if (!ts) return 'noch keine Meldung';
        const d = new Date(ts * 1000);
        return two(d.getDate()) + '.' + two(d.getMonth() + 1) + '. ' + two(d.getHours()) + ':' + two(d.getMinutes());
    }

    function shortDate(iso) {
        const p = iso.split('-');
        return p[2] + '.' + p[1] + '.';
    }

    function showTab(tab) {
        ['Overview', 'Stats'].forEach(t => {
            $('tab' + t).classList.toggle('active', t === tab);
            $('page' + t).classList.toggle('active', t === tab);
        });
    }

    function refresh() {
        $('refresh').classList.add('busy');
        clearTimeout(busyTimer);
        busyTimer = setTimeout(() => $('refresh').classList.remove('busy'), 15000);
        requestAction('Refresh', '');
    }

    function chip(cls, text) {
        const c = el('span', 'chip ' + cls);
        c.append(el('i'), el('span', '', text));
        return c;
    }

    // with the ignition on the vehicle was not parked yet: no warning for a state that is probably out of date
    function lockChip(locked, lockedText, openText, lastText, ignitionOn) {
        if (locked) return chip('good', lockedText);
        return ignitionOn ? chip('neutral', lastText) : chip('warn', openText);
    }

    function row(parent, label, text, cls) {
        const r = el('div', 'row');
        const name = el('span');
        name.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[label] || '') + '</svg>';
        name.append(label);
        r.append(name, el('span', cls || '', text));
        parent.append(r);
    }

    // list of open positions: [] = all closed, null = not reported
    function openRow(parent, label, open) {
        if (open === null || open === undefined) return;
        if (open.length === 0) row(parent, label, 'Alle geschlossen', 'good');
        else row(parent, label, 'Offen: ' + open.join(', '), 'warn');
    }

    function flagRow(parent, label, open) {
        if (open === null || open === undefined) return;
        row(parent, label, open ? 'Offen' : 'Geschlossen', open ? 'warn' : 'good');
    }

    function renderOverview(s) {
        const fuel = s.fuel === null ? 0 : Math.max(0, Math.min(100, s.fuel));
        $('ring').setAttribute('stroke-dasharray', fuel + ' 100');
        $('ring').style.stroke = { critical: 'var(--jt-red)', low: 'var(--jt-orange)' }[s.fuelState] || '';
        // a round line cap would draw a dot at 0 %
        $('ring').style.display = fuel > 0 ? '' : 'none';
        $('fuel').textContent = s.fuel === null ? '–' : s.fuel + ' %';
        $('range').textContent = unit(s.range, 'km');
        $('odometer').textContent = unit(s.odometer, 'km');
        $('voltage').textContent = unit(s.voltage, 'V', 1);

        const chips = [];
        if (s.locked !== null) chips.push(lockChip(s.locked, 'Verriegelt', 'Entriegelt', 'Zuletzt entriegelt', s.ignitionOn));
        if (s.bootLocked !== null) chips.push(lockChip(s.bootLocked, 'Kofferraum verriegelt', 'Kofferraum entriegelt', 'Kofferraum zuletzt entriegelt', s.ignitionOn));
        $('chips').replaceChildren(...chips);

        const v = $('vehicle');
        v.replaceChildren(el('h3', '', 'Fahrzeug'));
        openRow(v, 'Türen', s.doors);
        openRow(v, 'Fenster', s.windows);
        flagRow(v, 'Verdeck', s.convertible);
        flagRow(v, 'Kofferraum', s.boot);
        flagRow(v, 'Motorhaube', s.hood);
        if (s.service !== null) row(v, 'Service in', unit(s.service, 'km'));
        if (s.warnings.length) row(v, 'Warnungen', s.warnings.join(', '), 'warn');
        else if (s.lastReport) row(v, 'Warnungen', 'Keine', 'good');
        if (v.children.length === 1) v.append(el('div', 'hint', 'Noch keine Fahrzeugdaten. Das Fahrzeug meldet sich spätestens nach der nächsten Fahrt.'));

        const t = $('tyreCard');
        t.style.display = s.tyres.length ? '' : 'none';
        t.replaceChildren(el('h3', '', 'Reifendruck'));
        const grid = el('div', 'tyres');
        s.tyres.forEach(w => {
            const c = el('div', 'tyre' + (w.low ? ' low' : ''));
            c.append(el('small', '', w.label + (w.low ? ' · niedrig' : '')), el('b', '', unit(w.bar, 'bar', 2)));
            grid.append(c);
        });
        t.append(grid);

        renderMap(s);
    }

    // map from OpenStreetMap tiles with a short credit; redrawn only when position or size change
    function renderMap(s) {
        $('mapCard').style.display = s.position ? '' : 'none';
        if (!s.position) {
            mapKey = ''; mapPos = null; tilesKey = '';
            $('tiles').replaceChildren();
            $('mapFrame').removeAttribute('src');
            return;
        }
        const lat = Number(s.position.lat), lon = Number(s.position.lon);
        const key = lat.toFixed(5) + ',' + lon.toFixed(5);
        $('where').textContent = lat.toFixed(5) + ', ' + lon.toFixed(5) + ' · ' + stamp(s.lastReport);
        if (key === mapKey) return;
        mapKey = key;
        mapPos = { lat, lon };
        $('mapLink').href = 'https://www.openstreetmap.org/?mlat=' + lat.toFixed(5) + '&mlon=' + lon.toFixed(5) + '#map=16/' + lat.toFixed(5) + '/' + lon.toFixed(5);
        if (tilesFailed) showFrame();
        else drawTiles();
    }

    function drawTiles() {
        const box = $('map');
        const w = box.clientWidth, h = box.clientHeight;
        if (!mapPos || tilesFailed || !w || !h) return;
        const key = mapKey + '/' + w + 'x' + h;
        if (key === tilesKey) return;
        tilesKey = key;
        const zoom = 16, size = 256, count = 2 ** zoom;
        const rad = mapPos.lat * Math.PI / 180;
        const px = (mapPos.lon + 180) / 360 * count * size;
        const py = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * count * size;
        const images = [];
        for (let x = Math.floor((px - w / 2) / size); x <= Math.floor((px + w / 2) / size); x++) {
            for (let y = Math.floor((py - h / 2) / size); y <= Math.floor((py + h / 2) / size); y++) {
                if (y < 0 || y >= count) continue;
                const img = el('img');
                img.alt = '';
                img.referrerPolicy = 'strict-origin-when-cross-origin';
                img.style.left = Math.round(x * size - px + w / 2) + 'px';
                img.style.top = Math.round(y * size - py + h / 2) + 'px';
                img.onerror = useFrame;
                img.src = 'https://tile.openstreetmap.org/' + zoom + '/' + (((x % count) + count) % count) + '/' + y + '.png';
                images.push(img);
            }
        }
        $('tiles').replaceChildren(...images);
    }

    // the tile server refused: fall back to the embed page of OpenStreetMap
    function useFrame() {
        if (tilesFailed) return;
        tilesFailed = true;
        $('tiles').replaceChildren();
        showFrame();
    }

    function showFrame() {
        if (!mapPos) return;
        const d = 0.004;
        const bbox = [mapPos.lon - d, mapPos.lat - d, mapPos.lon + d, mapPos.lat + d].map(x => x.toFixed(5)).join(',');
        $('map').hidden = true;
        $('mapFrame').hidden = false;
        $('mapFrame').src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(bbox) + '&layer=mapnik&marker=' + encodeURIComponent(mapKey);
    }

    function renderDay() {
        const day = state.stats.days.find(d => d.date === selected);
        if (!day) return;
        $('dayLabel').textContent = 'Strecke am ' + shortDate(day.date);
        $('dayKm').replaceChildren(document.createTextNode(number(day.km) + ' '), el('small', '', 'km'));
        [...$('bars').children].forEach(b => b.classList.toggle('selected', b.dataset.date === selected));
    }

    function renderStats(s) {
        const days = s.stats.days;
        if (!days.some(d => d.date === selected)) {
            const driven = days.filter(d => d.km > 0);
            selected = (driven.length ? driven[driven.length - 1] : days[days.length - 1]).date;
        }
        const max = Math.max(1, ...days.map(d => d.km));
        $('bars').replaceChildren(...days.map(d => {
            const b = el('button', d.km > 0 ? '' : 'zero');
            b.dataset.date = d.date;
            b.title = shortDate(d.date) + ': ' + number(d.km) + ' km';
            b.setAttribute('aria-label', b.title);
            b.onclick = () => { selected = d.date; renderDay(); };
            const bar = el('i');
            bar.style.height = (d.km / max * 100) + '%';
            b.append(bar);
            return b;
        }));
        $('axisFrom').textContent = shortDate(days[0].date);
        $('total').textContent = number(s.stats.total);
        $('perDay').textContent = number(s.stats.perDay);
        $('drivingDays').textContent = s.stats.drivingDays;
        renderDay();
    }

    function render() {
        const s = state;
        $('name').textContent = s.name;
        $('stand').textContent = stamp(s.lastReport);
        $('pill').classList.toggle('on', s.online);
        $('pillText').textContent = s.online ? 'Online' : 'Offline';
        renderOverview(s);
        renderStats(s);
        $('smallFuel').textContent = s.fuel === null ? '–' : s.fuel + ' %';
        const parts = [unit(s.range, 'km')];
        if (s.locked !== null) parts.push(s.locked ? 'Verriegelt' : s.ignitionOn ? 'Zuletzt entriegelt' : 'Entriegelt');
        $('smallText').textContent = parts.join(' · ');
    }

    function handleMessage(data) {
        state = typeof data === 'string' ? JSON.parse(data) : data;
        clearTimeout(busyTimer);
        $('refresh').classList.remove('busy');
        render();
    }

    new ResizeObserver(drawTiles).observe($('map'));
    new ResizeObserver(() => document.body.classList.toggle('small', document.body.clientHeight < 240)).observe(document.body);
</script>
